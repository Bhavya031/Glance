version: 2
builds:
  - main: ./cmd/glance
    binary: glance
    ldflags: -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    files:
      - README.md
      - THIRD_PARTY_NOTICES.txt
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  disable: true
